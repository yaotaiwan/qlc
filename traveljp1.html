<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>去過的日本都道府縣</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16202b;--mute:#5f6e7a;--line:#d6dce2;--acc:#1e4a6e;--accbg:#dbe8f3;--on:#fff;--bad:#a9322a;--badbg:#f8e1de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--card:#18232d;--ink:#e8eef3;--mute:#95a5b1;--line:#2c3b47;--acc:#8ab8e0;--accbg:#1c3347;--on:#0d1620;--bad:#f1a49d;--badbg:#3b1f1d}}
:root[data-theme="dark"]{--bg:#10171e;--card:#18232d;--ink:#e8eef3;--mute:#95a5b1;--line:#2c3b47;--acc:#8ab8e0;--accbg:#1c3347;--on:#0d1620;--bad:#f1a49d;--badbg:#3b1f1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Hiragino Sans","Microsoft JhengHei",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
button,textarea,input{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:17px;font-weight:500;margin:0}
.stat{font-size:20px;font-weight:500;white-space:nowrap}
.stat small{font-size:13px;color:var(--mute);font-weight:400}
.ms{font-size:12px;color:var(--mute);margin:4px 0 0}
main{padding:12px 14px 40px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lab{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px;font-size:14px;font-weight:500}
.cp{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 11px;font-size:13px;cursor:pointer}
textarea,input.code{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font:13px/1.7 ui-monospace,Menlo,monospace}
textarea{min-height:88px;resize:vertical}
.cand{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;margin:8px 0 0}
.cd{border:1px solid var(--acc);background:var(--accbg);color:var(--acc);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
#bad{color:var(--bad);font-size:13px;min-height:20px}
.help{font-size:12px;color:var(--mute);margin:8px 0 0}
.blk{margin:18px 0}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rg{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;padding:4px 11px;font-size:14px;font-weight:500;cursor:pointer}
.rg.full{background:var(--acc);color:var(--on)}
.rt{font-size:14px;font-weight:500;color:var(--acc);padding:4px 0}
.bh span.k{font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ch{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:15px;cursor:pointer}
.ch.on{background:var(--accbg);border-color:var(--acc);color:var(--ink)}
.ch.ex{background:var(--badbg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.tools{display:flex;gap:6px}
</style></head><body>
<header>
<div class="row"><h1>去過的日本都道府縣</h1><div class="stat"><span id="em">🏠</span> <span id="n">0</span> <small>/ 47</small></div></div>
<p class="ms">🚃 去過 1 個　🥉 10 個　🥈 20 個　🥇 全部 47 個</p>
</header>
<main>
<div class="box">
<div class="row" style="margin-bottom:10px"><span style="font-size:14px;color:var(--mute)">點選下方，或直接輸入</span><span class="tools"><button class="cp" id="clr">清空</button><button class="cp" id="all">全選</button></span></div>
<div class="lab"><span>清單</span><button class="cp" id="c1">複製</button></div>
<textarea id="list" spellcheck="false" autocapitalize="off" placeholder="輸入漢字，例如：東京、@關東、-千葉" aria-label="清單"></textarea>
<div class="cand" id="cand"></div>
<div id="bad"></div>
<div class="lab" style="margin-top:6px"><span>代碼</span><button class="cp" id="c2">複製</button></div>
<input class="code" id="code" spellcheck="false" autocapitalize="off" aria-label="代碼">
<p class="help">47 位元，base32 固定 10 字元。可直接貼上清單或代碼，離開輸入框後會自動整理成最短寫法。沖縄／沖繩、広島／廣島等異體字都能辨識。</p>
</div>
<div id="rg"></div>
</main>
<script>
var R=[
["北海道",null,"北海道"],
["東北","東北","青森 岩手 宮城 秋田 山形 福島"],
["關東","關東","茨城 栃木 群馬 埼玉 千葉 東京 神奈川"],
["中部","中部","新潟 富山 石川 福井 山梨 長野 岐阜 靜岡 愛知"],
["關西","關西","三重 滋賀 京都 大阪 兵庫 奈良 和歌山"],
["中國","中國","鳥取 島根 岡山 廣島 山口"],
["四國","四國","德島 香川 愛媛 高知"],
["九州沖繩","九州沖繩","福岡 佐賀 長崎 熊本 大分 宮崎 鹿兒島 沖繩"]
];
var CM={"縄":"繩","広":"廣","广":"廣","児":"兒","儿":"兒","静":"靜","徳":"德","県":"縣","县":"縣","爱":"愛","东":"東","冈":"岡","马":"馬","贺":"賀","叶":"葉","长":"長","宫":"宮","岛":"島","鸟":"鳥","关":"關","関":"關","国":"國"};
var ALL=[],IDX={},REG={},RTOK=[],S={},A32="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
R.forEach(function(r){r.n=r[2].split(" ");r.n.forEach(function(x){IDX[x]=ALL.length;ALL.push(x)});if(r[1]){REG[r[1]]=r.n;RTOK.push(r[1])}});
REG["全部"]=ALL;REG["全國"]=ALL;REG["近畿"]=REG["關西"];REG["九州"]=REG["九州沖繩"];
function $(i){return document.getElementById(i)}
function norm(s){s=s.trim().replace(/\u3000/g,"");var o="";for(var i=0;i<s.length;i++)o+=CM[s[i]]||s[i];
if(o.length>2&&/[縣府都]$/.test(o))o=o.slice(0,-1);else if(o.length>1&&/[縣府]$/.test(o)&&o!=="京都")o=o.slice(0,-1);return o}
function parse(t,skipLast){var inc={},exc={},bad=[],w=t.split(/[\s,，、;；]+/);if(skipLast)w.pop();
w.forEach(function(x){if(!x)return;var ng=/^[-－−]/.test(x);if(ng)x=x.slice(1);var l;if(x[0]==="@"||x[0]==="＠"){l=REG[norm(x.slice(1))]}else{var n=norm(x);if(n in IDX)l=[n]}
if(!l){bad.push((ng?"-":"")+x);return}l.forEach(function(c){(ng?exc:inc)[c]=1})});
var s={};for(var c in inc)if(!exc[c])s[c]=1;return{s:s,bad:bad}}
function enc(){var at=[],ps=[],ng=[],full=0;
R.forEach(function(r){var h=r.n.filter(function(c){return S[c]}),m=r.n.filter(function(c){return!S[c]});
if(!m.length){full++;if(r[1])at.push("@"+r[1]);else ps.push(r.n[0]);return}
if(r[1]&&h.length&&m.length+1<h.length){at.push("@"+r[1]);m.forEach(function(c){ng.push("-"+c)})}else h.forEach(function(c){ps.push(c)})});
if(full===R.length)return["@全部"];
var ord=function(a,b){return IDX[a.replace("-","")]-IDX[b.replace("-","")]};
return at.concat(ps.sort(ord),ng.sort(ord))}
function toCode(){var b="";ALL.forEach(function(c){b+=S[c]?"1":"0"});while(b.length%5)b+="0";var o="";for(var i=0;i<b.length;i+=5)o+=A32[parseInt(b.substr(i,5),2)];return"JP1-"+o}
function fromCode(t){t=t.replace(/\s/g,"").toUpperCase();if(!/^JP1-[A-Z2-7]{10}$/.test(t))return null;var b="";for(var i=4;i<14;i++)b+=("00000"+A32.indexOf(t[i]).toString(2)).slice(-5);if(b.slice(47)!=="000")return null;var s={};ALL.forEach(function(c,i){if(b[i]==="1")s[c]=1});return s}
function emoji(n){return n>=47?"🥇":n>=20?"🥈":n>=10?"🥉":n>=1?"🚃":"🏠"}
var h="";R.forEach(function(r,i){h+='<div class="blk"><div class="bh">'+(r[1]?'<button class="rg" data-r="'+i+'">'+r[0]+'</button>':'<span class="rt">'+r[0]+'</span>')+'<span class="k" id="k'+i+'"></span></div><div class="chips">';
r.n.forEach(function(c){h+='<button class="ch" data-c="'+c+'">'+c+'</button>'});h+='</div></div>'});
$("rg").innerHTML=h;
function upd(force){var t=enc(),ex={},n=0;t.forEach(function(x){if(x[0]==="-")ex[x.slice(1)]=1});for(var c in S)n++;
$("n").textContent=n;$("em").textContent=emoji(n);var L=$("list"),C=$("code");
if(force||document.activeElement!==L)L.value=t.join("、");if(force||document.activeElement!==C)C.value=toCode();
document.querySelectorAll("[data-c]").forEach(function(b){var c=b.dataset.c;b.className="ch"+(S[c]?" on":ex[c]?" ex":"")});
R.forEach(function(r,i){var k=r.n.filter(function(c){return S[c]}).length;$("k"+i).textContent=k+" / "+r.n.length;var b=document.querySelector('[data-r="'+i+'"]');if(b)b.className="rg"+(k===r.n.length?" full":"")})}
function cands(){var v=$("list").value,m=v.match(/[^\s,，、;；]*$/),q=m?m[0]:"",box=$("cand");box.innerHTML="";if(!q)return;
var pre="",rm=false;if(/^[-－−]/.test(q)){pre="-";q=q.slice(1)}if(q[0]==="@"||q[0]==="＠"){rm=true;q=q.slice(1)}
var n=norm(q),out=[];
if(!rm&&n){var a=ALL.filter(function(c){return c.indexOf(n)===0});if(!a.length)a=ALL.filter(function(c){return c.indexOf(n)>-1});a.slice(0,10).forEach(function(c){out.push(pre+c)})}
var ra=RTOK.concat(["全部"]).filter(function(c){return!n||c.indexOf(n)===0});
if(rm||(n&&!out.length))ra.forEach(function(c){out.push(pre+"@"+c)});
out.slice(0,10).forEach(function(o){var b=document.createElement("button");b.className="cd";b.textContent=o;b.onclick=function(){var L=$("list");L.value=L.value.replace(/[^\s,，、;；]*$/,"")+o+"、";S=parse(L.value).s;upd();cands();L.focus()};box.appendChild(b)})}
function msg(p){$("bad").textContent=p.bad.length?"無法辨識："+p.bad.join("、"):""}
$("list").addEventListener("input",function(){var p=parse(this.value,true);S=p.s;msg(p);upd();cands()});
$("list").addEventListener("blur",function(){var p=parse(this.value);S=p.s;msg(p);$("cand").innerHTML="";upd(true)});
$("code").addEventListener("input",function(){var s=fromCode(this.value);if(s){S=s;$("bad").textContent="";upd()}else $("bad").textContent="代碼格式不符，現有勾選未變動"});
$("code").addEventListener("blur",function(){$("bad").textContent="";upd(true)});
$("rg").onclick=function(e){var b=e.target.closest("button");if(!b)return;
if(b.dataset.c){var c=b.dataset.c;if(S[c])delete S[c];else S[c]=1}
else if(b.dataset.r){var r=R[b.dataset.r],all=r.n.every(function(c){return S[c]});r.n.forEach(function(c){if(all)delete S[c];else S[c]=1})}
upd(true)};
$("clr").onclick=function(){S={};upd(true)};
$("all").onclick=function(){ALL.forEach(function(c){S[c]=1});upd(true)};
function cp(id,b){var t=$(id).value,o=b.textContent,ok=function(){b.textContent="已複製";setTimeout(function(){b.textContent=o},1200)};
var fb=function(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(x){}document.body.removeChild(a);ok()};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb()}
$("c1").onclick=function(){cp("list",this)};$("c2").onclick=function(){cp("code",this)};
upd(true);
</script></body></html>
