<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台灣百岳快選清單</title>
<style>
:root{--bg:#f4f3ee;--card:#fffefb;--ink:#141413;--sub:#6b6a63;--line:#e0ddd0;--acc:#c15f3c;--accbg:#f3ddd2;--accink:#8f3d1f}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--card:#30302e;--ink:#faf9f5;--sub:#b1ada1;--line:#454542;--acc:#d97757;--accbg:#4a3328;--accink:#f0b49b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{margin:0;font:600 19px/1.3 Georgia,"Noto Serif TC","Songti TC",serif}
#cnt{font-size:16px;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:14px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
main{padding:2px 14px 24px}
.panel{display:none}.panel.on{display:block}
.sh{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.sh h2{margin:0;font-size:13px;font-weight:600;color:var(--sub)}
.sh .c{font-size:12px;color:var(--sub);flex:1}
.sh .all{padding:3px 10px;border:1px solid var(--line);background:transparent;color:var(--accink);border-radius:8px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.grid button{padding:9px 2px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:13px;line-height:1.3}
.grid button.s{background:var(--accbg);border-color:var(--acc);color:var(--accink);font-weight:600}
label{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin:10px 0 4px}
label button{padding:4px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:12px;margin-left:4px}
textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:14px/1.7 inherit;resize:vertical}
#tx{min-height:170px}
#cd{font:14px/1.7 ui-monospace,Menlo,monospace;word-break:break-all;min-height:70px}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
.msg{min-height:18px;font-size:12px;color:var(--acc);margin-top:3px}
</style>
</head>
<body>
<div class="top">
  <div class="hd"><h1>台灣百岳快選清單</h1><span id="cnt">🏠 0/100</span></div>
  <div class="tabs" id="tabs"></div>
</div>
<main id="main"></main>

<script>
const D={
玉雪:[
 ['雪山山脈','雪山,雪山北峰,雪山東峰,中雪山,大雪山,頭鷹山,大劍山,劍山,佳陽山,志佳陽大山,火石山,品田山,池有山,桃山,喀拉業山,大霸尖山,小霸尖山,伊澤山,加利山'],
 ['玉山山脈','玉山,玉山東峰,玉山北峰,玉山南峰,玉山西峰,玉山前峰,南玉山,東小南山,鹿山']],
中央北:[
 ['合歡群峰','合歡山,合歡山東峰,北合歡山,西合歡山,石門山'],
 ['北一段','南湖大山,南湖大山東峰,南湖大山南峰,南湖北山,審馬陣山,馬比杉山,巴巴山,中央尖山'],
 ['北二段','閂山,鈴鳴山,甘薯峰,無明山'],
 ['中橫四辣','畢祿山,羊頭山,屏風山,白姑大山'],
 ['奇萊','奇萊北峰,奇萊主山,奇萊南峰,磐石山'],
 ['能高安東軍','能高山,能高山南峰,南華山,光頭山,白石山,安東軍山'],
 ['其他','太魯閣大山,立霧主山,喀西帕南山,帕托魯山,馬西山']],
中央南:[
 ['干卓萬群峰','干卓萬山,卓社大山,萬東山西峰,郡大山,牧山'],
 ['八通關·秀姑巒','八通關山,西巒大山,秀姑巒山,馬博拉斯山,馬利加南山,新康山,駒盆山,六順山'],
 ['南三段','丹大山,內嶺爾山,義西請馬至山,東郡大山,東巒大山,無雙山'],
 ['南二段','向陽山,三叉山,南雙頭山,雲峰,轆轆山,塔芬山,達芬尖山,大水窟山'],
 ['南一段','關山,小關山,海諾南山,卑南主山,關山嶺山,塔關山,庫哈諾辛山'],
 ['南端','北大武山,布拉克桑山']]};
const ALIAS={玉山主峰:'玉山',雪山主峰:'雪山',合歡山主峰:'合歡山',合歡山北峰:'北合歡山',合歡北峰:'北合歡山',合歡東峰:'合歡山東峰',南湖東峰:'南湖大山東峰',南湖南峰:'南湖大山南峰',奇萊主峰:'奇萊主山',北大武:'北大武山',甘藷峰:'甘薯峰'};

/* 資料：ALL 山名、SEC 區塊 */
const ALL=[],SEC=[];
Object.keys(D).forEach(tab=>D[tab].forEach(([title,list])=>{
  const ids=list.split(',').map(n=>{ALL.push(n);return ALL.length-1});
  SEC.push({tab,title,ids});
}));
const N=ALL.length;
const idx=new Map(ALL.map((n,i)=>[n,i]));
const st=new Uint8Array(N);
const $=s=>document.querySelector(s);
const tabsEl=$('#tabs'),main=$('#main');
const btns=[];
let expand=false;

/* 頁面 */
const names=['清單',...Object.keys(D)];
const panels={};
const lp=document.createElement('section');lp.className='panel';
lp.innerHTML='<label><span>文字清單</span><span><button id="all">全選百岳</button><button id="ex">展開</button><button id="ct">複製</button></span></label><textarea id="tx" spellcheck="false"></textarea><div class="hint">語法：@區塊名 選整區；-山名 排除；@頁籤名 選整個頁籤。例：@雪山山脈,-雪山</div><div class="msg" id="mt"></div><label><span>代碼（base64）</span><button id="cc">複製</button></label><textarea id="cd" spellcheck="false"></textarea><div class="msg" id="mc"></div>';
panels['清單']=lp;
Object.keys(D).forEach(k=>{
  const p=document.createElement('section');p.className='panel';
  SEC.filter(s=>s.tab===k).forEach(s=>{
    const h=document.createElement('div');h.className='sh';
    h.innerHTML='<h2></h2><span class="c"></span><button type="button" class="all">全選</button>';
    h.querySelector('h2').textContent=s.title;
    s.cnt=h.querySelector('.c');s.all=h.querySelector('.all');
    s.all.onclick=()=>{const full=s.ids.every(i=>st[i]);s.ids.forEach(i=>st[i]=full?0:1);sync()};
    p.appendChild(h);
    const g=document.createElement('div');g.className='grid';
    s.ids.forEach(i=>{
      const b=document.createElement('button');b.type='button';b.textContent=ALL[i];
      b.onclick=()=>{st[i]^=1;sync()};
      btns[i]=b;g.appendChild(b);
    });
    p.appendChild(g);
  });
  panels[k]=p;
});
names.forEach(t=>{
  const b=document.createElement('button');b.type='button';b.textContent=t;
  b.onclick=()=>show(t);tabsEl.appendChild(b);main.appendChild(panels[t]);
});
function show(t){
  [...tabsEl.children].forEach(b=>b.classList.toggle('on',b.textContent===t));
  names.forEach(n=>panels[n].classList.toggle('on',n===t));
  scrollTo(0,0);
}

/* 代碼：[版本=1][數量][位元資料...][檢查碼] → base64 */
const NB=Math.ceil(N/8);
function enc(){
  const a=new Uint8Array(3+NB);a[0]=1;a[1]=N;
  for(let i=0;i<N;i++)if(st[i])a[2+(i>>3)]|=1<<(i&7);
  let s=0;for(let i=0;i<2+NB;i++)s=(s+a[i])&255;a[2+NB]=s;
  return btoa(String.fromCharCode(...a));
}
function dec(str){
  try{
    const r=atob(str.replace(/\s/g,'')),a=[...r].map(c=>c.charCodeAt(0));
    if(a.length!==3+NB)return {e:'代碼長度不符，可能不完整'};
    if(a[0]!==1)return {e:'代碼版本不符'};
    if(a[1]!==N)return {e:'項目數量與目前清單不符'};
    let s=0;for(let i=0;i<2+NB;i++)s=(s+a[i])&255;
    if(s!==a[2+NB])return {e:'檢查碼錯誤，代碼可能被改動'};
    const o=new Uint8Array(N);
    for(let i=0;i<N;i++)o[i]=(a[2+(i>>3)]>>(i&7))&1;
    return {o};
  }catch(x){return {e:'代碼格式錯誤'}}
}

/* 文字輸出：精簡（@區塊、-排除）或展開（全部山名） */
function expandedText(){return ALL.filter((n,i)=>st[i]).join(',')}
function compactText(){
  if(st.every(v=>v))return '@全部';
  const out=[],minus=[];
  Object.keys(D).forEach(tab=>{
    const secs=SEC.filter(s=>s.tab===tab);
    if(secs.every(s=>s.ids.every(i=>st[i]))){out.push('@'+tab);return}
    secs.forEach(s=>{
      const sel=s.ids.filter(i=>st[i]),miss=s.ids.filter(i=>!st[i]);
      if(!sel.length)return;
      if(!miss.length){out.push('@'+s.title);return}
      if(miss.length+1<sel.length){out.push('@'+s.title);miss.forEach(i=>minus.push('-'+ALL[i]))}
      else sel.forEach(i=>out.push(ALL[i]));
    });
  });
  return out.concat(minus).join(',');
}

/* 文字解析：加入先處理，排除（-）最後處理 */
function grab(name){
  if(name==='全部')return ALL.map((n,i)=>i);
  const s=SEC.filter(x=>x.title===name);
  if(s.length)return s.flatMap(x=>x.ids);
  if(D[name])return SEC.filter(x=>x.tab===name).flatMap(x=>x.ids);
  return null;
}
function parse(txt){
  const add=new Set(),rm=new Set(),bad=[];
  txt.split(/[,，、;；\s]+/).filter(Boolean).forEach(orig=>{
    let t=orig,neg=false;
    if(/^[-－−]/.test(t)){neg=true;t=t.slice(1)}
    let ids=null;
    if(/^[@＠]/.test(t))ids=grab(t.slice(1));
    else{const n=ALIAS[t]||t;if(idx.has(n))ids=[idx.get(n)]}
    if(!ids)bad.push(orig);else ids.forEach(i=>(neg?rm:add).add(i));
  });
  const o=new Uint8Array(N);
  add.forEach(i=>o[i]=1);rm.forEach(i=>o[i]=0);
  return {o,bad};
}

/* 進度徽章 */
function badge(n){return n>=100?'🥇':n>=50?'🥈':n>=10?'🥉':n>=1?'🥾':'🏠'}

const tx=$('#tx'),cd=$('#cd'),mt=$('#mt'),mc=$('#mc');
function sync(skip){
  let c=0;
  for(let i=0;i<N;i++){btns[i].classList.toggle('s',!!st[i]);c+=st[i]}
  SEC.forEach(s=>{
    const k=s.ids.filter(i=>st[i]).length;
    s.cnt.textContent=k+'/'+s.ids.length;
    s.all.textContent=k===s.ids.length?'取消全選':'全選';
  });
  $('#cnt').textContent=badge(c)+' '+c+'/'+N;
  $('#all').textContent=c===N?'取消全選':'全選百岳';
  if(skip!=='tx')tx.value=expand?expandedText():compactText();
  if(skip!=='cd')cd.value=enc();
}

/* 文字 → 狀態 */
let t1,t2;
function applyText(final){
  const {o,bad}=parse(tx.value);
  st.set(o);
  mt.textContent=bad.length?'無法辨識（已略過）：'+bad.join('、'):'';
  sync(final&&!bad.length?undefined:'tx');
}
tx.addEventListener('input',()=>{clearTimeout(t1);t1=setTimeout(()=>applyText(false),600)});
tx.addEventListener('blur',()=>{clearTimeout(t1);applyText(true)});

/* 代碼 → 狀態（驗證成功才套用，空白不清除） */
function applyCode(final){
  const v=cd.value.trim();
  if(!v){mc.textContent='';if(final)cd.value=enc();return}
  const r=dec(v);
  if(r.e){mc.textContent=r.e+'，已保留原選取';if(final)cd.value=enc();return}
  mc.textContent='';st.set(r.o);sync('cd');
}
cd.addEventListener('input',()=>{clearTimeout(t2);t2=setTimeout(()=>applyCode(false),600)});
cd.addEventListener('blur',()=>{clearTimeout(t2);applyCode(true)});

/* 全選百岳、展開／精簡、複製 */
$('#all').onclick=()=>{const full=st.every(v=>v);st.fill(full?0:1);sync()};
$('#ex').onclick=e=>{expand=!expand;e.target.textContent=expand?'精簡':'展開';sync()};
function copy(el,btn){
  const t=el.value;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{el.select();document.execCommand('copy')});
  const o=btn.textContent;btn.textContent='已複製';setTimeout(()=>btn.textContent=o,1200);
}
$('#ct').onclick=e=>copy(tx,e.target);
$('#cc').onclick=e=>copy(cd,e.target);

show('清單');sync();
</script>
</body>
</html>
